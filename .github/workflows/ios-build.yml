name: iOS build check

on:
  push:
    paths:
      - 'ios/ExteraGram/**'
      - 'tools/scripts/**'
  workflow_dispatch:

jobs:
  compile-module:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build ExteraGram module (compile check)
        shell: bash
        run: |
          mkdir -p build
          # Компиляция Swift-файлов модуля: проверка синтаксиса/типов без полного билда
          # приложения (полный билд telegram-ios требует подписи — см. docs/build.md).
          set -o pipefail
          xcrun swiftc -parse \
            -sdk "$(xcrun --show-sdk-path --sdk iphonesimulator)" \
            -target arm64-apple-ios16.0-simulator \
            ios/ExteraGram/ExteraConfig.swift \
            ios/ExteraGram/ExteraLocaleController.swift \
            ios/ExteraGram/ExteraIconManager.swift \
            ios/ExteraGram/ExteraAppIconController.swift \
            ios/ExteraGram/ExteraAppIconSelectionController.swift \
            ios/ExteraGram/ExteraTextFilters.swift \
            ios/ExteraGram/ExteraUiHelpers.swift \
            ios/ExteraGram/ExteraMathEngine.swift \
            2>&1 | tee build/swift-parse.log
          echo "parse OK"

      - name: Type-check module
        shell: bash
        run: |
          set -o pipefail
          xcrun swiftc -typecheck \
            -sdk "$(xcrun --show-sdk-path --sdk iphonesimulator)" \
            -target arm64-apple-ios16.0-simulator \
            ios/ExteraGram/ExteraConfig.swift \
            ios/ExteraGram/ExteraLocaleController.swift \
            ios/ExteraGram/ExteraIconManager.swift \
            ios/ExteraGram/ExteraAppIconController.swift \
            ios/ExteraGram/ExteraAppIconSelectionController.swift \
            ios/ExteraGram/ExteraTextFilters.swift \
            ios/ExteraGram/ExteraUiHelpers.swift \
            ios/ExteraGram/ExteraMathEngine.swift \
            2>&1 | tee build/swift-typecheck.log
          echo "typecheck OK"

      - name: Validate .strings files
        shell: bash
        run: |
          fail=0
          for f in ios/ExteraGram/Resources/*.lproj/Extera.strings; do
            if ! plutil -lint "$f" >/dev/null 2>&1; then
              echo "INVALID: $f"; fail=1
            fi
          done
          echo "strings lint done (fail=$fail)"
          exit $fail

      - name: Validate xcassets Contents.json
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, sys
          bad = []
          for base in ('assets/Icons.xcassets', 'assets/AppIcons.xcassets'):
              for root, dirs, files in os.walk(base):
                  if 'Contents.json' in files:
                      p = os.path.join(root, 'Contents.json')
                      try:
                          json.loads(open(p, 'rb').read().decode('utf-8-sig'))
                      except Exception as e:
                          bad.append((p, str(e)))
          for p, e in bad[:20]:
              print('INVALID:', p, e)
          print('checked Contents.json: OK' if not bad else f'FAILED: {len(bad)}')
          sys.exit(1 if bad else 0)
          EOF

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-logs
          path: build/
          retention-days: 7
