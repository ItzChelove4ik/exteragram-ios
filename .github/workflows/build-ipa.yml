name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'release_arm64'
        type: choice
        options:
          - release_arm64
          - debug_arm64
  push:
    branches: [main]
    paths:
      - 'ios/ExteraGram/**'
      - 'tools/scripts/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 360 # полный билд telegram-ios: 1-3 часа
    permissions:
      contents: write

    steps:
      - name: Checkout (LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Fix nested submodule remotes (webrtc)
        shell: bash
        run: |
          # checkout@v4 иногда теряет remote вложенных сабмодулей (webrtc
          # указывал на telegram-ios вместо ali-fareed/webrtc) — sync восстанавливает
          cd ios/telegram-ios
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1             third-party/webrtc/webrtc ||             (git -C third-party/webrtc/webrtc remote set-url origin https://github.com/ali-fareed/webrtc.git              && git -C third-party/webrtc/webrtc fetch origin 6513c71d6c80311d69a0a6b9c09fcf32cfbeb247              && git -C third-party/webrtc/webrtc checkout 6513c71d6c80311d69a0a6b9c09fcf32cfbeb247)

      - name: Free disk space
        shell: bash
        run: |
          # очистка для ~40GB билда
          sudo rm -rf /Applications/Xcode_15* /Applications/Xcode_16* 2>/dev/null || true
          df -h /

      - name: Select Xcode
        shell: bash
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Bazel
        shell: bash
        run: |
          brew install bazelisk
          bazel --version

      - name: Install Python deps
        shell: bash
        run: |
          python3 -m pip install pillow --break-system-packages

      - name: Verify Xcode/bazel versions vs versions.json
        shell: bash
        run: |
          cat ios/telegram-ios/versions.json
          # Make.py сверяет версии; допускаем расхождение через bazelArguments при необходимости

      - name: Integrate ExteraGram module
        shell: bash
        run: |
          # модуль + иконки (BUILD-патч идемпотентен); скрипты работают от корня репо
          bash tools/scripts/integrate-module.sh
          python3 tools/scripts/gen-alticons-bazel.py || true

      - name: Build (unsigned, xcode-managed codesigning off, no profiles)
        shell: bash
        run: |
          cd ios/telegram-ios
          # xcodeManagedCodesigning: aps_environment="" — профили не нужны
          # SideLoadly подпишет ipa своим Apple ID при установке
          python3 build-system/Make/Make.py build \
            --configurationPath="$GITHUB_WORKSPACE/ios/configuration/sideload-configuration.json" \
            --configuration="${{ inputs.configuration || 'release_arm64' }}" \
            --xcodeManagedCodesigning \
            --bazelArguments="--//Telegram:disableProvisioningProfiles" \
            --bazelArguments="--//Telegram:disableProvisioningProfiles" \
            --buildNumber=1 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/build-artifacts"
        timeout-minutes: 300

      - name: Rename IPA
        shell: bash
        run: |
          if [ -f build-artifacts/Telegram.ipa ]; then
            mv build-artifacts/Telegram.ipa "build-artifacts/ExteraGram-iOS-unsigned.ipa"
            ls -la build-artifacts/
          else
            echo "IPA not found — build failed above"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExteraGram-iOS-unsigned
          path: build-artifacts/ExteraGram-iOS-unsigned.ipa
          retention-days: 90
          compression-level: 0 # ipa уже сжат

      - name: Create Release (optional, on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/ExteraGram-iOS-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
